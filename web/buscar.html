<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar · Memoria del equipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">

  <!-- Mismo fragmento que en las otras tres páginas, y duplicado por el mismo
       motivo: js/tema.js es un módulo (diferido) y sin esto la página
       parpadearía en oscuro antes de pasar a claro. Ver web/ESTILO.md. -->
  <script>
    try {
      var t = localStorage.getItem("tema");
    } catch (e) {
      var t = null;
    }
    document.documentElement.dataset.tema =
      t || (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro");
  </script>
</head>
<body>
  <header>
    <div class="contenedor">
      <div class="titulo">
        <h1>Buscar en las transcripciones</h1>
        <p><a href="/" class="volver">← Volver al histórico</a> ·
          <a href="/acciones.html">Acciones</a> ·
          <a href="/chat.html">Preguntar</a></p>
      </div>
      <button type="button" id="tema" class="tema" aria-label="Cambiar de tema" title="Cambiar de tema">
        <svg class="sol" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
        <svg class="luna" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <form class="filtros" id="filtros">
      <div class="campo ancho">
        <label for="q">Qué se dijo</label>
        <!-- autofocus: se llega aquí para teclear, no para mirar. -->
        <input type="search" id="q" name="q" autofocus
               placeholder="certificado, &quot;entorno de pre&quot;, refact*">
      </div>
      <div class="campo">
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">
          <option value="">Todos</option>
          <option value="daily">Daily</option>
          <option value="workshop">Workshop</option>
          <option value="retro">Retro</option>
          <option value="planning">Planning</option>
        </select>
      </div>
      <div class="campo">
        <label for="desde">Desde</label>
        <input type="date" id="desde" name="desde">
      </div>
      <div class="campo">
        <label for="hasta">Hasta</label>
        <input type="date" id="hasta" name="hasta">
      </div>
      <div class="campo">
        <label for="orden">Orden</label>
        <select id="orden" name="orden">
          <option value="relevancia">Más relevantes</option>
          <option value="reciente">Más recientes</option>
          <option value="antiguo">Más antiguas</option>
        </select>
      </div>
      <button type="submit">Buscar</button>
      <button type="button" id="limpiar">Limpiar</button>
    </form>

    <section class="bloque" aria-labelledby="t-resultados">
      <h2 id="t-resultados">Resultados <span id="total"></span></h2>
      <p class="nota">Se busca sobre la transcripción completa de todo el
        histórico, por palabras enteras y sin distinguir acentos. Cada resultado
        abre la reunión en esa misma línea.</p>

      <!-- Las reuniones donde aparece el término, como filtro. Vienen
           calculadas sin el filtro de reunión, así que acotar a una no borra
           la lista desde la que se acota. -->
      <div class="reuniones-encontradas" id="reuniones" role="group"
           aria-label="Acotar a una reunión"></div>

      <div id="resultados"></div>
    </section>
  </main>

  <footer>
    <span id="salud"></span>
  </footer>

  <script type="module" src="/js/buscar.js"></script>
</body>
</html>
