<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memoria del equipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">

  <!-- Inline y antes de pintar nada: si esto viviera en js/tema.js (un modulo,
       y por tanto diferido) la pagina parpadearia en oscuro antes de pasar a
       claro. Es la unica logica de tema duplicada, y a proposito. -->
  <script>
    try {
      var t = localStorage.getItem("tema");
    } catch (e) {
      var t = null;
    }
    document.documentElement.dataset.tema =
      t || (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro");
  </script>
</head>
<body>
  <header>
    <div class="contenedor">
      <div class="titulo">
        <h1>Memoria del equipo</h1>
        <p>Histórico de reuniones transcritas y resumidas</p>
      </div>
      <button type="button" id="tema" class="tema" aria-label="Cambiar de tema" title="Cambiar de tema">
        <svg class="sol" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
        <svg class="luna" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <form class="filtros" id="filtros">
      <div class="campo">
        <label for="desde">Desde</label>
        <input type="date" id="desde" name="desde">
      </div>
      <div class="campo">
        <label for="hasta">Hasta</label>
        <input type="date" id="hasta" name="hasta">
      </div>
      <div class="campo">
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">
          <option value="">Todos</option>
          <option value="daily">Daily</option>
          <option value="workshop">Workshop</option>
          <option value="retro">Retro</option>
          <option value="planning">Planning</option>
        </select>
      </div>
      <button type="submit">Filtrar</button>
      <button type="button" id="limpiar">Limpiar</button>
      <span id="total"></span>
    </form>

    <section id="listado">
      <div class="aviso">Cargando…</div>
    </section>
  </main>

  <footer>
    <span id="salud"></span>
  </footer>

  <!-- type="module" para poder importar api.js. Sin bundler: el servidor no
       tiene internet y no hay cadena de construccion que mantener. -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
