<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preguntar · Memoria del equipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">

  <!-- Mismo fragmento que en las otras cuatro páginas, y duplicado por el
       mismo motivo: js/tema.js es un módulo (diferido) y sin esto la página
       parpadearía en oscuro antes de pasar a claro. Ver web/ESTILO.md. -->
  <script>
    try {
      var t = localStorage.getItem("tema");
    } catch (e) {
      var t = null;
    }
    document.documentElement.dataset.tema =
      t || (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro");
  </script>
</head>
<body>
  <header>
    <div class="contenedor">
      <div class="titulo">
        <h1>Preguntar al histórico</h1>
        <p><a href="/" class="volver">← Volver al histórico</a> ·
          <a href="/acciones.html">Acciones</a> ·
          <a href="/buscar.html">Buscar</a></p>
      </div>
      <button type="button" id="tema" class="tema" aria-label="Cambiar de tema" title="Cambiar de tema">
        <svg class="sol" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
        <svg class="luna" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="bloque" aria-labelledby="t-chat">
      <h2 id="t-chat">Conversación</h2>
      <!-- Dice con qué se está respondiendo: híbrida o solo literal. Una
           respuesta pobre puede ser culpa del índice y no del histórico. -->
      <p class="nota" id="estado"></p>

      <div class="conversacion" id="conversacion" aria-live="polite"></div>

      <form class="filtros preguntar" id="filtros">
        <div class="campo ancho">
          <label for="q">Tu pregunta</label>
          <input type="text" id="q" name="q" autofocus autocomplete="off"
                 placeholder="¿Qué lleva más tiempo bloqueado?">
        </div>
        <button type="submit" id="preguntar">Preguntar</button>
        <button type="button" id="parar" hidden>Parar</button>
        <button type="button" id="exportar">Exportar</button>
        <button type="button" id="limpiar">Limpiar</button>
      </form>

      <details class="acotar">
        <summary>Acotar la búsqueda</summary>
        <div class="filtros">
          <div class="campo">
            <label for="persona">Persona</label>
            <input type="text" id="persona" name="persona" autocomplete="off"
                   placeholder="Todas">
          </div>
          <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo">
              <option value="">Todos</option>
              <option value="daily">Daily</option>
              <option value="workshop">Workshop</option>
              <option value="retro">Retro</option>
              <option value="planning">Planning</option>
            </select>
          </div>
          <div class="campo">
            <label for="desde">Desde</label>
            <input type="date" id="desde" name="desde">
          </div>
          <div class="campo">
            <label for="hasta">Hasta</label>
            <input type="date" id="hasta" name="hasta">
          </div>
        </div>
        <p class="tenue">Lo que se ponga aquí manda sobre lo que el modelo
          deduzca de la pregunta.</p>
      </details>
    </section>
  </main>

  <footer>
    <span id="salud"></span>
  </footer>

  <script type="module" src="/js/chat.js"></script>
</body>
</html>
