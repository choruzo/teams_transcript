<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1250" width="1500" height="1250" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>teams_transcript — proceso y flujos de ejecución</title>

  <style>
    .bg      { fill: #ffffff; }
    .band    { fill: #f4f6fa; stroke: #dfe5ef; rx: 14; }
    .bandnum { fill: #94a1b8; font-size: 26px; font-weight: 700; }
    .bandttl { fill: #3b4658; font-size: 15px; font-weight: 700; }
    .bandsub { fill: #8593aa; font-size: 11.5px; }

    .proc    { fill: #e9f0fd; stroke: #5b84c8; stroke-width: 1.4; rx: 10; }
    .data    { fill: #e9f7ef; stroke: #3f9b6a; stroke-width: 1.4; rx: 10; }
    .ext     { fill: #fdf1e3; stroke: #d1852f; stroke-width: 1.4; rx: 10; }
    .opt     { fill: #f6f2fb; stroke: #8b6fbe; stroke-width: 1.4; stroke-dasharray: 5 4; rx: 10; }

    .ttl     { fill: #26303f; font-size: 13.5px; font-weight: 700; }
    .sub     { fill: #66748c; font-size: 11px; }
    .mono    { font-family: Consolas, "DejaVu Sans Mono", monospace; }

    .flow    { fill: none; stroke: #8a97ab; stroke-width: 1.8; marker-end: url(#a); }
    .flow2   { fill: none; stroke: #b09ad2; stroke-width: 1.6; stroke-dasharray: 5 4; marker-end: url(#b); }
    .lbl     { fill: #7b899e; font-size: 10.5px; }

    .legttl  { fill: #3b4658; font-size: 12px; font-weight: 700; }
    .leg     { fill: #66748c; font-size: 11px; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97ab"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b09ad2"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1250"/>

  <!-- cabecera -->
  <text x="30" y="42" fill="#1d2634" font-size="22" font-weight="700">teams_transcript — proceso y flujos de ejecución</text>
  <text x="30" y="62" class="bandsub">Grabar · transcribir · resumir · almacenar · indexar · consultar.  Cada banda puede ejecutarse en una máquina distinta.</text>

  <!-- ================= BANDA 1 ================= -->
  <rect class="band" x="30" y="80" width="1440" height="140"/>
  <text x="52" y="122" class="bandnum">1</text>
  <text x="52" y="146" class="bandttl">Captura</text>
  <text x="52" y="164" class="bandsub">PC Windows</text>
  <text x="52" y="180" class="bandsub mono">record_teams.py</text>

  <rect class="ext"  x="250" y="112" width="200" height="76"/>
  <text x="350" y="140" class="ttl" text-anchor="middle">Reunión de Teams</text>
  <text x="350" y="158" class="sub" text-anchor="middle">micrófono + altavoces</text>
  <text x="350" y="173" class="sub" text-anchor="middle">(consentimiento requerido)</text>

  <rect class="proc" x="510" y="112" width="200" height="76"/>
  <text x="610" y="138" class="ttl mono" text-anchor="middle">record_teams.py</text>
  <text x="610" y="156" class="sub" text-anchor="middle">2 streams: mic + loopback</text>
  <text x="610" y="171" class="sub" text-anchor="middle">callback no bloqueante + cola</text>

  <rect class="proc" x="770" y="112" width="200" height="76"/>
  <text x="870" y="138" class="ttl mono" text-anchor="middle">mix_wavs</text>
  <text x="870" y="156" class="sub" text-anchor="middle">resample al rate mayor</text>
  <text x="870" y="171" class="sub" text-anchor="middle">normaliza si hay clipping</text>

  <rect class="data" x="1030" y="112" width="200" height="76"/>
  <text x="1130" y="138" class="ttl mono" text-anchor="middle">*_mixed.wav</text>
  <text x="1130" y="156" class="sub mono" text-anchor="middle">*_mic.wav · *_system.wav</text>
  <text x="1130" y="171" class="sub" text-anchor="middle">carpeta grabaciones/</text>

  <rect class="data" x="1270" y="112" width="200" height="76"/>
  <text x="1370" y="138" class="ttl mono" text-anchor="middle">glosario.py</text>
  <text x="1370" y="156" class="sub mono" text-anchor="middle">datos/glosario.md</text>
  <text x="1370" y="171" class="sub" text-anchor="middle">jerga, siglas, nombres</text>

  <path class="flow" d="M450,150 L505,150"/>
  <path class="flow" d="M710,150 L765,150"/>
  <path class="flow" d="M970,150 L1025,150"/>

  <!-- ================= BANDA 2 ================= -->
  <rect class="band" x="30" y="240" width="1440" height="150"/>
  <text x="52" y="282" class="bandnum">2</text>
  <text x="52" y="306" class="bandttl">Transcripción</text>
  <text x="52" y="324" class="bandsub">servidor Linux + GPU</text>
  <text x="52" y="340" class="bandsub mono">transcribe_teams.py</text>

  <rect class="proc" x="250" y="277" width="200" height="80"/>
  <text x="350" y="303" class="ttl" text-anchor="middle">Whisper</text>
  <text x="350" y="321" class="sub mono" text-anchor="middle">detect_device → cuda/cpu</text>
  <text x="350" y="336" class="sub mono" text-anchor="middle">carry_initial_prompt=True</text>
  <text x="350" y="350" class="sub" text-anchor="middle">segmentos con tiempos</text>

  <rect class="opt"  x="510" y="277" width="200" height="80"/>
  <text x="610" y="303" class="ttl mono" text-anchor="middle">--diarize (opcional)</text>
  <text x="610" y="321" class="sub" text-anchor="middle">pyannote 3.1 sobre el audio</text>
  <text x="610" y="336" class="sub mono" text-anchor="middle">assign_speakers</text>
  <text x="610" y="350" class="sub" text-anchor="middle">por mayor solapamiento</text>

  <rect class="proc" x="770" y="277" width="200" height="80"/>
  <text x="870" y="303" class="ttl mono" text-anchor="middle">colapsar_repeticiones</text>
  <text x="870" y="321" class="sub" text-anchor="middle">corta los bucles del carry</text>
  <text x="870" y="336" class="sub" text-anchor="middle">cortos: 3 seguidos</text>
  <text x="870" y="350" class="sub" text-anchor="middle">largos: ventana de 10</text>

  <rect class="data" x="1030" y="277" width="200" height="80"/>
  <text x="1130" y="307" class="ttl mono" text-anchor="middle">.txt + .srt</text>
  <text x="1130" y="326" class="sub" text-anchor="middle">se escriben ANTES de diarizar</text>
  <text x="1130" y="342" class="sub" text-anchor="middle">si falla, quedan sin hablantes</text>

  <path class="flow" d="M450,317 L505,317"/>
  <path class="flow" d="M710,317 L765,317"/>
  <path class="flow" d="M970,317 L1025,317"/>
  <path class="flow" d="M1130,192 L1130,214 L350,214 L350,272"/>
  <text x="740" y="209" class="lbl" text-anchor="middle">el .wav pasa al servidor (scp / bundle offline)</text>
  <path class="flow2" d="M1370,192 L1370,234 L380,234 L380,272"/>
  <text x="950" y="230" class="lbl" text-anchor="middle">initial_prompt (≤700 caracteres: Whisper se queda con los últimos)</text>

  <!-- ================= BANDA 3 ================= -->
  <rect class="band" x="30" y="410" width="1440" height="230"/>
  <text x="52" y="452" class="bandnum">3</text>
  <text x="52" y="476" class="bandttl">Resumen</text>
  <text x="52" y="494" class="bandsub">LLM local</text>
  <text x="52" y="510" class="bandsub mono">summarize_teams.py</text>

  <rect class="proc" x="250" y="447" width="200" height="80"/>
  <text x="350" y="473" class="ttl mono" text-anchor="middle">summarize_teams.py</text>
  <text x="350" y="491" class="sub mono" text-anchor="middle">--tipo daily|retro|…</text>
  <text x="350" y="506" class="sub" text-anchor="middle">prompt por tipo + glosario</text>
  <text x="350" y="520" class="sub" text-anchor="middle">pide JSON, temperature 0.1</text>

  <rect class="ext"  x="510" y="447" width="200" height="80"/>
  <text x="610" y="473" class="ttl mono" text-anchor="middle">llm.chat</text>
  <text x="610" y="491" class="sub" text-anchor="middle">LiteLLM / llama-server</text>
  <text x="610" y="506" class="sub mono" text-anchor="middle">/v1/chat/completions</text>
  <text x="610" y="520" class="sub" text-anchor="middle">solo urllib (stdlib)</text>

  <rect class="proc" x="770" y="447" width="200" height="80"/>
  <text x="870" y="473" class="ttl mono" text-anchor="middle">extraer_json → normalizar</text>
  <text x="870" y="491" class="sub" text-anchor="middle">1 reintento; si falla, .md crudo</text>
  <text x="870" y="506" class="sub" text-anchor="middle">y salida 2 sin tocar la BD</text>
  <text x="870" y="520" class="sub" text-anchor="middle">descarta arrastres inventados</text>

  <rect class="data" x="1030" y="447" width="200" height="80"/>
  <text x="1130" y="473" class="ttl mono" text-anchor="middle">renderizar_markdown</text>
  <text x="1130" y="491" class="sub mono" text-anchor="middle">&lt;nombre&gt;_resumen.md</text>
  <text x="1130" y="508" class="sub" text-anchor="middle">el .md se pinta en Python,</text>
  <text x="1130" y="522" class="sub" text-anchor="middle">no lo escribe el modelo</text>

  <rect class="proc" x="250" y="550" width="200" height="70"/>
  <text x="350" y="576" class="ttl mono" text-anchor="middle">acciones_abiertas</text>
  <text x="350" y="594" class="sub" text-anchor="middle">arrastres de las últimas N</text>
  <text x="350" y="609" class="sub" text-anchor="middle">reuniones, con su action_id</text>

  <rect class="proc" x="510" y="550" width="200" height="70"/>
  <text x="610" y="576" class="ttl" text-anchor="middle">Segmentos del .srt</text>
  <text x="610" y="594" class="sub" text-anchor="middle">tiempos + hablante</text>
  <text x="610" y="609" class="sub" text-anchor="middle">sin .srt → .txt, tiempos NULL</text>

  <path class="flow" d="M450,487 L505,487"/>
  <path class="flow" d="M710,487 L765,487"/>
  <path class="flow" d="M970,487 L1025,487"/>
  <path class="flow" d="M350,545 L350,532"/>
  <text x="360" y="543" class="lbl">inyectados en el user prompt</text>
  <path class="flow" d="M1130,362 L1130,400 L350,400 L350,442"/>
  <text x="740" y="394" class="lbl" text-anchor="middle">transcripción completa</text>
  <path class="flow" d="M1230,317 L1256,317 L1256,585 L715,585"/>
  <text x="900" y="578" class="lbl" text-anchor="middle">el .srt hermano</text>

  <!-- ================= BANDA 4 ================= -->
  <rect class="band" x="30" y="660" width="1440" height="140"/>
  <text x="52" y="702" class="bandnum">4</text>
  <text x="52" y="726" class="bandttl">Histórico</text>
  <text x="52" y="744" class="bandsub">única capa SQL</text>
  <text x="52" y="760" class="bandsub mono">memoria.py</text>

  <rect class="proc" x="250" y="692" width="200" height="76"/>
  <text x="350" y="718" class="ttl mono" text-anchor="middle">memoria.py</text>
  <text x="350" y="736" class="sub mono" text-anchor="middle">crear_reunion(reemplazar)</text>
  <text x="350" y="751" class="sub mono" text-anchor="middle">_deshacer_arrastres</text>

  <rect class="data" x="510" y="692" width="200" height="76"/>
  <text x="610" y="718" class="ttl mono" text-anchor="middle">datos/meetings.db</text>
  <text x="610" y="736" class="sub" text-anchor="middle">SQLite + WAL, esquema v2</text>
  <text x="610" y="751" class="sub mono" text-anchor="middle">uid = identidad estable</text>

  <rect class="data" x="770" y="692" width="200" height="76"/>
  <text x="870" y="716" class="ttl" text-anchor="middle">Tablas</text>
  <text x="870" y="734" class="sub mono" text-anchor="middle">meetings · segments + segments_fts</text>
  <text x="870" y="749" class="sub mono" text-anchor="middle">actions · updates · risks · personas</text>

  <rect class="proc" x="1030" y="692" width="200" height="76"/>
  <text x="1130" y="716" class="ttl" text-anchor="middle">Reprocesar = sustituir</text>
  <text x="1130" y="734" class="sub" text-anchor="middle">borra la fila anterior pero conserva</text>
  <text x="1130" y="749" class="sub mono" text-anchor="middle">uid e id → los enlaces no rompen</text>

  <path class="flow" d="M450,730 L505,730"/>
  <path class="flow" d="M710,730 L765,730"/>
  <path class="flow" d="M970,730 L1025,730"/>
  <path class="flow" d="M870,532 L870,650 L350,650 L350,687"/>
  <text x="640" y="644" class="lbl" text-anchor="middle">JSON validado: resumen, acciones, updates, riesgos</text>
  <path class="flow" d="M610,625 L610,650"/>
  <path class="flow" d="M262,687 L262,600 L262,548"/>
  <text x="196" y="620" class="lbl" text-anchor="middle" transform="rotate(-90 196 620)">lee arrastres</text>

  <!-- ================= BANDA 5 ================= -->
  <rect class="band" x="30" y="820" width="1440" height="140"/>
  <text x="52" y="862" class="bandnum">5</text>
  <text x="52" y="886" class="bandttl">Índice semántico</text>
  <text x="52" y="904" class="bandsub">derivado y reconstruible</text>
  <text x="52" y="920" class="bandsub mono">indexar_teams.py · rag.py</text>

  <rect class="proc" x="250" y="852" width="200" height="76"/>
  <text x="350" y="878" class="ttl mono" text-anchor="middle">indexar_teams.py</text>
  <text x="350" y="896" class="sub mono" text-anchor="middle">--reconstruir · --reunion</text>
  <text x="350" y="911" class="sub" text-anchor="middle">incremental por huella sha1</text>

  <rect class="proc" x="510" y="852" width="200" height="76"/>
  <text x="610" y="878" class="ttl mono" text-anchor="middle">rag.py</text>
  <text x="610" y="896" class="sub" text-anchor="middle">trocea y guarda idx_inicio</text>
  <text x="610" y="911" class="sub mono" text-anchor="middle">texto_a_embeber (+cabecera)</text>

  <rect class="ext"  x="770" y="852" width="200" height="76"/>
  <text x="870" y="878" class="ttl mono" text-anchor="middle">llm.embeddings</text>
  <text x="870" y="896" class="sub" text-anchor="middle">bge-m3, 1024 dims</text>
  <text x="870" y="911" class="sub mono" text-anchor="middle">TEAMS_EMBED_BASE_URL</text>

  <rect class="data" x="1030" y="852" width="200" height="76"/>
  <text x="1130" y="878" class="ttl mono" text-anchor="middle">datos/indice.db</text>
  <text x="1130" y="896" class="sub mono" text-anchor="middle">sqlite-vec (vec0)</text>
  <text x="1130" y="911" class="sub" text-anchor="middle">migrar = vaciar y reconstruir</text>

  <rect class="opt" x="1270" y="852" width="200" height="76"/>
  <text x="1370" y="878" class="ttl" text-anchor="middle">El índice es opcional</text>
  <text x="1370" y="896" class="sub" text-anchor="middle">sin sqlite-vec o sin modelo,</text>
  <text x="1370" y="911" class="sub" text-anchor="middle">se responde solo con FTS5</text>

  <path class="flow" d="M450,890 L505,890"/>
  <path class="flow" d="M710,890 L765,890"/>
  <path class="flow" d="M970,890 L1025,890"/>
  <path class="flow" d="M610,772 L610,810 L350,810 L350,847"/>
  <text x="470" y="804" class="lbl" text-anchor="middle">segmentos</text>

  <!-- ================= BANDA 6 ================= -->
  <rect class="band" x="30" y="980" width="1440" height="215"/>
  <text x="52" y="1022" class="bandnum">6</text>
  <text x="52" y="1046" class="bandttl">Interfaz web</text>
  <text x="52" y="1064" class="bandsub">Docker, solo lectura</text>
  <text x="52" y="1080" class="bandsub mono">api/ + web/</text>

  <rect class="proc" x="250" y="1012" width="200" height="80"/>
  <text x="350" y="1038" class="ttl mono" text-anchor="middle">api/ (FastAPI)</text>
  <text x="350" y="1056" class="sub mono" text-anchor="middle">conectar(solo_lectura, entre_hilos)</text>
  <text x="350" y="1071" class="sub" text-anchor="middle">sin SQL propio: todo en memoria.py</text>
  <text x="350" y="1085" class="sub" text-anchor="middle">esquema viejo → 503 explicativo</text>

  <rect class="data" x="510" y="1012" width="200" height="80"/>
  <text x="610" y="1036" class="ttl mono" text-anchor="middle">web/ (5 páginas)</text>
  <text x="610" y="1054" class="sub" text-anchor="middle">timeline · reunión · acciones</text>
  <text x="610" y="1069" class="sub" text-anchor="middle">búsqueda · chat</text>
  <text x="610" y="1084" class="sub" text-anchor="middle">SVG a mano, sin librerías</text>

  <rect class="proc" x="770" y="1012" width="200" height="80"/>
  <text x="870" y="1038" class="ttl mono" text-anchor="middle">ask_teams.py</text>
  <text x="870" y="1056" class="sub" text-anchor="middle">interpretar → recuperar → responder</text>
  <text x="870" y="1071" class="sub" text-anchor="middle">plan JSON validado; nunca bloquea</text>
  <text x="870" y="1085" class="sub" text-anchor="middle">rama agregada (SQL) o búsqueda</text>

  <rect class="proc" x="1030" y="1012" width="200" height="80"/>
  <text x="1130" y="1038" class="ttl mono" text-anchor="middle">rag.buscar</text>
  <text x="1130" y="1056" class="sub" text-anchor="middle">FTS5 + vec0 fusionados</text>
  <text x="1130" y="1071" class="sub mono" text-anchor="middle">RRF sobre los puestos (K=60)</text>
  <text x="1130" y="1085" class="sub" text-anchor="middle">devuelve modo y aviso</text>

  <rect class="ext"  x="1030" y="1112" width="200" height="70"/>
  <text x="1130" y="1138" class="ttl mono" text-anchor="middle">llm.chat_stream</text>
  <text x="1130" y="1156" class="sub" text-anchor="middle">SSE; fuentes antes del texto</text>
  <text x="1130" y="1171" class="sub" text-anchor="middle">fallo del LLM = evento error</text>

  <rect class="data" x="510" y="1112" width="200" height="70"/>
  <text x="610" y="1138" class="ttl" text-anchor="middle">Respuesta con citas</text>
  <text x="610" y="1156" class="sub mono" text-anchor="middle">[n] → reunion.html#s-&lt;idx&gt;</text>
  <text x="610" y="1171" class="sub" text-anchor="middle">historial en sessionStorage</text>

  <path class="flow" d="M450,1042 L505,1042"/>
  <path class="flow" d="M710,1052 L765,1052"/>
  <path class="flow" d="M970,1052 L1025,1052"/>
  <path class="flow" d="M1130,1092 L1130,1107"/>
  <path class="flow" d="M1025,1147 L715,1147"/>
  <path class="flow" d="M610,772 L742,772 L742,942 L226,942 L226,1032 L245,1032"/>
  <text x="484" y="936" class="lbl" text-anchor="middle">meetings.db — WAL: la web lee mientras el pipeline escribe</text>
  <path class="flow" d="M1130,932 L1130,966 L1256,966 L1256,1052 L1235,1052"/>
  <text x="1310" y="962" class="lbl" text-anchor="middle">indice.db</text>
  <text x="738" y="1044" class="lbl" text-anchor="middle">POST /api/chat</text>
  <text x="760" y="1006" class="lbl">la conexión se abre y se cierra dentro del generador, no en Depends</text>

  <!-- ================= LEYENDA ================= -->
  <text x="1270" y="1018" class="legttl">Leyenda</text>
  <rect class="proc" x="1270" y="1030" width="18" height="14"/>
  <text x="1296" y="1042" class="leg">script / módulo Python</text>
  <rect class="data" x="1270" y="1054" width="18" height="14"/>
  <text x="1296" y="1066" class="leg">fichero o base de datos</text>
  <rect class="ext"  x="1270" y="1078" width="18" height="14"/>
  <text x="1296" y="1090" class="leg">servicio externo (LLM, audio)</text>
  <rect class="opt"  x="1270" y="1102" width="18" height="14"/>
  <text x="1296" y="1114" class="leg">opcional o degradable</text>
  <path class="flow" d="M1270,1136 L1290,1136"/>
  <text x="1300" y="1140" class="leg">flujo de datos</text>
  <path class="flow2" d="M1270,1160 L1290,1160"/>
  <text x="1300" y="1164" class="leg">contexto (glosario)</text>

  <text x="30" y="1225" class="bandsub">Bandas 1 y 2: procesos manuales (CLI) en máquinas distintas · 3 a 5: el pipeline por reunión · 6: solo lectura. Nada de la web escribe en meetings.db.</text>
</svg>
