# Despliegue de la interfaz web. Vale igual en el portatil y en el servidor
# porque la estructura del proyecto es la misma en ambos.
#
# NO hay clave `build:` a proposito: en el servidor no hay internet y un build
# solo puede fallar. La imagen se construye en el portatil y se lleva con
# `docker save` / `docker load` (ver docker/DESPLIEGUE.md).

services:
  api:
    image: teams-transcript-api:0.2.0   # tag fijo y versionado, nunca :latest
    pull_policy: never                  # no intentes ir a ningun registro
    container_name: teams-api
    restart: unless-stopped

    environment:
      TEAMS_DB: /app/datos/meetings.db
      # Por defecto la API no escribe. Cuando existan los endpoints de
      # correccion manual (fase I6) habra que ponerlo a 0 conscientemente.
      TEAMS_API_SOLO_LECTURA: "1"
      # La BD guarda rutas absolutas de la maquina que proceso la reunion;
      # dentro del contenedor el proyecto vive en /app. Ajusta el origen a la
      # ruta real del host (en Windows, algo como
      # C:\Users\tu_usuario\Documents\teams_transcript).
      TEAMS_RAIZ_ORIGEN: ${TEAMS_RAIZ_ORIGEN:-}
      TEAMS_RAIZ_LOCAL: /app

      # El chat (I5). LiteLLM corre en el host, fuera del compose: dentro del
      # contenedor "localhost" es el propio contenedor, de ahi el
      # host.docker.internal de mas abajo.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://host.docker.internal:4000/v1}
      # Los embeddings pueden estar en otro puerto: con un proxy LiteLLM
      # delante no hace falta, con dos `llama-server` sueltos si.
      TEAMS_EMBED_BASE_URL: ${TEAMS_EMBED_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      TEAMS_LLM_MODELO: ${TEAMS_LLM_MODELO:-}
      TEAMS_EMBED_MODELO: ${TEAMS_EMBED_MODELO:-}
      # Indice semantico. Si el fichero no existe, el chat responde igual con
      # busqueda literal y lo dice en pantalla.
      TEAMS_INDICE: /app/datos/indice.db

    volumes:
      # Codigo: se monta, no se hornea. Actualizar = scp + docker compose restart.
      - ./api:/app/api:ro
      - ./web:/app/web:ro
      - ./memoria.py:/app/memoria.py:ro
      # La vista de reunion (I2) reutiliza `renderizar_markdown` y los
      # titulos de `TIPOS` de summarize_teams.py en vez de copiarlos, y ese
      # modulo importa glosario.py. Sin montarlos, la web funciona pero las
      # secciones propias de retro/planning desaparecen y la descarga del
      # .md devuelve 503. Ninguno de los dos anade dependencias: son stdlib.
      - ./summarize_teams.py:/app/summarize_teams.py:ro
      - ./glosario.py:/app/glosario.py:ro
      # El chat (I5) importa ask_teams.py, que a su vez importa rag.py y
      # llm.py. Sin montarlos, /api/chat devuelve un 503 explicativo y la
      # pagina del chat queda inutil; las otras cuatro siguen funcionando.
      # Los tres son stdlib salvo `sqlite-vec`, que va en la imagen.
      - ./ask_teams.py:/app/ask_teams.py:ro
      - ./rag.py:/app/rag.py:ro
      - ./llm.py:/app/llm.py:ro
      # Datos: en el host, nunca dentro de una imagen (contienen el texto
      # literal de las reuniones). Con escritura porque SQLite en WAL necesita
      # crear los ficheros -wal y -shm aunque solo se lea.
      - ./datos:/app/datos
      - ./grabaciones:/app/grabaciones:ro

    # Solo localhost: se accede por tunel SSH. Abrirlo a la LAN exige
    # autenticacion primero (PLAN_INTERFAZ.md, seccion 6).
    ports:
      - "127.0.0.1:8080:8000"

    # En Linux este alias no existe por defecto; es como el contenedor llega a
    # LiteLLM, que corre en el host junto a la GPU.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/salud').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
